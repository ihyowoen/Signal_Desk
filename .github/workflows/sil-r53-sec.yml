name: SIL R53 SEC Micron Source Census (isolated research branch)
on:
  push:
    branches:
      - research/sil-r53-sec-census-20261122
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect_public_sec:
    if: github.ref == 'refs/heads/research/sil-r53-sec-census-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Collect SEC original submissions and Micron 12 original 10-K/10-Q filings
        run: |
          python3 research/sil-r53/sec_census.py
      - name: Upload immutable evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-r53-sec-micron-20261122
          path: out/
          if-no-files-found: warn
          retention-days: 7
