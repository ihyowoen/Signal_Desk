name: SIL R55 SK Hynix 2025 KR Exchange Official Mirror Raw
on:
  push:
    branches:
      - research/sil-r53-sec-census-20261122
permissions:
  contents: read
jobs:
  krx_2025:
    if: github.ref == 'refs/heads/research/sil-r53-sec-census-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official Korea Exchange 2025 SK Hynix business report mirror and verify content/sha
        run: |
          python3 - <<'PY'
          import subprocess,hashlib,json,sys
          from pathlib import Path
          out=Path('out');out.mkdir(exist_ok=True)
          url='https://kind.krx.co.kr/external/2026/03/17/000735/20260317002879/11011.htm'
          d=out/'SKHYNIX_FY2025_KRX_OFFICIAL_REPORT_MIRROR.html'
          p=subprocess.run(['curl','-fsSL','--connect-timeout','10','--max-time','60','--max-filesize','45000000','--retry','0','-A','Mozilla/5.0 (SIL independent evidence verification)','-o',str(d),url],capture_output=True,text=True)
          blob=d.read_bytes() if d.exists() else b''
          decoded=blob.decode('utf-8',errors='replace') if b'charset=utf-8' in blob[:5000].lower() else blob.decode('euc-kr',errors='replace')
          codes=['에스케이하이닉스','2025','사업보고서']
          matches={s:(s in decoded.replace(' ','')) for s in codes}
          status='PRESERVED_KRX_OFFICIAL_HTML_MIRROR' if p.returncode==0 and len(blob)>100000 and all(matches.values()) else 'FAILED_IDENTITY_OR_DOWNLOAD'
          details={'as_of_KST':'2026-11-23','company':'SK hynix','period':'FY2025','DART_accession':'20260317000635','official_KRX_primary_mirror':url,'status':status,'curl_code':p.returncode,'bytes':len(blob),'SHA256':hashlib.sha256(blob).hexdigest() if blob else None,'identity':matches,'sec_or_dart_as_filed_byte_equivalence':'NOT_TESTED','amendment_full_chain':'OPEN','error':p.stderr[:180]}
          (out/'R55_SKHYNIX_KRX_MANIFEST.json').write_text(json.dumps(details,ensure_ascii=False,indent=2),encoding='utf8')
          if status!='PRESERVED_KRX_OFFICIAL_HTML_MIRROR':d.unlink(missing_ok=True)
          print(json.dumps(details,ensure_ascii=False),flush=True)
          sys.exit(0 if status=='PRESERVED_KRX_OFFICIAL_HTML_MIRROR' else 2)
          PY
      - name: Upload KRX primary mirror bytes and SHA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-r55-skhynix-2025-krx-html
          path: out/
          retention-days: 10
