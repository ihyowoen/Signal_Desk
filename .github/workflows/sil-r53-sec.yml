name: SIL R55 Samsung issuer reports 2023-26 15 PDF custody
on:
  push:
    branches:
      - research/sil-r53-sec-census-20261122
permissions:
  contents: read
jobs:
  samsung15:
    if: github.ref == 'refs/heads/research/sil-r53-sec-census-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Fetch issuer PDF 15 reports, SHA256 and fail-closed log
        run: |
          python3 - <<'PY'
          import json,subprocess,hashlib,sys
          from pathlib import Path
          out=Path('out');out.mkdir(exist_ok=True)
          cohort=[(str(year),q) for year in [2023,2024,2025] for q in ['1Q','2Q','3Q','4Q']]+[('2026',q) for q in ['1Q','2Q','3Q']]
          statuses=[]
          for year,q in cohort:
            url=f'https://images.samsung.com/kdp/ir/business-report/{year}_{q}_Interim_Business_Report_vF_kr.pdf'
            path=out/year/f'SAMSUNG_{year}_{q}_ISSUER_KR.pdf';path.parent.mkdir(parents=True,exist_ok=True)
            cmd=['curl','-fsSL','--max-time','38','--connect-timeout','9','--retry','0','-A','Mozilla/5.0 (SIL source research; official issuer PDF)','-H','Accept: application/pdf','--max-filesize','65000000','-o',str(path),url]
            ret=subprocess.run(cmd,capture_output=True,text=True,timeout=43)
            b=path.read_bytes() if path.exists() else b''
            status='CAPTURED' if ret.returncode==0 and b.startswith(b'%PDF-') and len(b)>40000 else 'FAILED'
            row={'R40_issuer':'SAMSUNG','year':year,'period_slot':q,'source_url':url,'official_origin':'images.samsung.com first-party issuer','DART_as_filed_exact_byte_identity':'NOT_TESTED','full_amendment_chain':'NOT_TESTED','capture_status':status,'bytes':len(b) if status=='CAPTURED' else 0,'sha256':hashlib.sha256(b).hexdigest() if status=='CAPTURED' else None,'error':ret.stderr.strip()[:240],'archive_path':str(path) if status=='CAPTURED' else None}
            if status!='CAPTURED':path.unlink(missing_ok=True)
            statuses.append(row)
            print(json.dumps({k:row[k] for k in ('year','period_slot','capture_status','bytes','error')}),flush=True)
          manifest={'run':'SIL-R55-SAMSUNG-ISSUER-15','as_of_kst':'2026-11-23','expected':len(cohort),'captured':sum(x['capture_status']=='CAPTURED' for x in statuses),'records':statuses,'absolute_scope':'issuer-hosted copies not DART raw, no amendment history'}
          (out/'R55_SAMSUNG_15_MANIFEST.json').write_text(json.dumps(manifest,indent=2,ensure_ascii=False),encoding='utf-8')
          print(json.dumps({'expected':len(cohort),'captured':manifest['captured'],'missing':len(cohort)-manifest['captured']}),flush=True)
          sys.exit(0)
          PY
      - name: Upload manifest and HTTP failure provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-r55-samsung-capture-manifest
          path: out/R55_SAMSUNG_15_MANIFEST.json
          if-no-files-found: warn
          retention-days: 10
      - name: Upload Samsung 2023 PDF bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-r55-samsung-2023
          path: out/2023/
          if-no-files-found: warn
          retention-days: 10
      - name: Upload Samsung 2024 PDF bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-r55-samsung-2024
          path: out/2024/
          if-no-files-found: warn
          retention-days: 10
      - name: Upload Samsung 2025 PDF bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-r55-samsung-2025
          path: out/2025/
          if-no-files-found: warn
          retention-days: 10
      - name: Upload Samsung 2026 PDF bytes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-r55-samsung-2026
          path: out/2026/
          if-no-files-found: warn
          retention-days: 10
