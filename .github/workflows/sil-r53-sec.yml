name: SIL R54 Micron 2024 first-party PDF custody
on:
  push:
    branches:
      - research/sil-r53-sec-census-20261122
permissions:
  contents: read
jobs:
  micron_2024:
    if: github.ref == 'refs/heads/research/sil-r53-sec-census-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Download 2024 original issuer PDF and log exact provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess,sys
          from pathlib import Path
          d=Path("out");d.mkdir(exist_ok=True)
          urls=[
            "https://micron.gcs-web.com/static-files/fa623e00-b0d7-4f70-bbc2-d52296cd9147",
            "https://investors.micron.com/static-files/fa623e00-b0d7-4f70-bbc2-d52296cd9147",
            "https://micron.gcs-web.com/static-files/c5f6c770-a182-417e-bb2b-6e192c403164",
            "https://investors.micron.com/static-files/c5f6c770-a182-417e-bb2b-6e192c403164"]
          result={"as_of_KST":"2026-11-23","fiscal_period":"2024-08-29","source":"Micron first party investor relations","SEC_accession":"0000723125-24-000027","SEC_original_binary_equivalence":"NOT_TESTED","attempts":[],"custody":"FAILED"}
          for url in urls:
            p=d/"try_download.bin";header=d/"response_headers.txt"
            cmd=["curl","--location","--silent","--show-error","--fail","--max-time","28","--connect-timeout","9","--retry","0","--user-agent","Mozilla/5.0 (compatible; SILEvidenceResearch/1.0)","-H","Accept: application/pdf","-D",str(header),"-o",str(p),url]
            v=subprocess.run(cmd,capture_output=True,text=True)
            b=p.read_bytes() if p.exists() else b""
            detail={"url":url,"curl_code":v.returncode,"byte_count":len(b),"file_magic":b[:12].hex(),"stderr":v.stderr[:220],"http_headers":header.read_text(errors="replace")[-650:] if header.exists() else ""}
            result["attempts"].append(detail)
            print(json.dumps({"url":url,"status":v.returncode,"len":len(b),"magic":b[:6].hex(),"stderr":v.stderr[:120]}),flush=True)
            if v.returncode==0 and b.startswith(b"%PDF-") and len(b)>100000:
              name="MICRON_FY2024_10K_ISSUER_20241004.pdf"
              (d/name).write_bytes(b)
              result.update({"custody":"PRESERVED","source_url":url,"filename":name,"bytes":len(b),"SHA256":hashlib.sha256(b).hexdigest()})
              break
          for name in ("try_download.bin","response_headers.txt"):
            (d/name).unlink(missing_ok=True)
          (d/"R54_FY2024_MANIFEST.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({k:v for k,v in result.items() if k!="attempts"}),flush=True)
          sys.exit(0 if result["custody"]=="PRESERVED" else 2)
          PY
      - name: Upload raw source or diagnostics, even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sil-r54-micron-fy2024-issuer
          path: out/
          if-no-files-found: warn
          retention-days: 10
